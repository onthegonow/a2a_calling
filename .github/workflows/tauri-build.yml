name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync native app version
        # A2A-95: keep Tauri bundle version aligned with npm package release version.
        run: npm run build:sync-version

      - name: Run test suite
        run: npm test

      - name: Run standalone E2E tests
        run: npm run test:e2e:standalone
        env:
          A2A_RUNTIME: test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native/macos/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build standalone server binaries
        # A2A-95: ship target-specific sidecar binaries before Tauri bundle assembly.
        run: bash scripts/build-standalone.sh --universal

      - name: Smoke test standalone binary
        run: bash scripts/smoke-test-standalone.sh

      - name: Validate Apple signing secrets
        run: |
          # A2A-94: signing + notarization must fail closed if release credentials are missing.
          required_vars=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for key in "${required_vars[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: ${key}" >&2
              exit 1
            fi
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build universal binary
        working-directory: native/macos/src-tauri
        run: |
          cargo tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Verify notarized artifacts
        run: |
          bash scripts/verify-app-bundle.sh

          APP_PATH="native/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/A2A Callbook.app"
          DMG_PATH=$(ls native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)

          if [ ! -d "$APP_PATH" ]; then
            echo "Missing app bundle at $APP_PATH" >&2
            exit 1
          fi
          if [ -z "$DMG_PATH" ] || [ ! -f "$DMG_PATH" ]; then
            echo "Missing DMG artifact" >&2
            exit 1
          fi

          # A2A-94: enforce hardened, signed, stapled artifacts before release upload.
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Package artifacts
        run: |
          VERSION="$(node -p \"require('./package.json').version\")"
          cd native/macos/src-tauri/target/universal-apple-darwin/release/bundle

          # Create tar.gz of .app for postinstall download
          if [ -d "macos/A2A Callbook.app" ]; then
            cd macos
            tar -czf "../A2A-Callbook-${VERSION}.app.tar.gz" "A2A Callbook.app"
            cd ..
          fi

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SIG_FILE="native/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/A2A Callbook.app.tar.gz.sig"
          bash scripts/generate-update-manifest.sh "${VERSION}" "${SIG_FILE}" "Release v${VERSION}" > latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/A2A-Callbook-*.app.tar.gz
            latest.json

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/A2A-Callbook-*.app.tar.gz
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
