name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Validate Apple signing secrets
        run: |
          # A2A-94: signing + notarization must fail closed if release credentials are missing.
          required_vars=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for key in "${required_vars[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: ${key}" >&2
              exit 1
            fi
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build universal binary
        working-directory: native/macos/src-tauri
        run: |
          cargo tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Verify notarized artifacts
        run: |
          APP_PATH="native/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/A2A Callbook.app"
          DMG_PATH=$(ls native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)

          if [ ! -d "$APP_PATH" ]; then
            echo "Missing app bundle at $APP_PATH" >&2
            exit 1
          fi
          if [ -z "$DMG_PATH" ] || [ ! -f "$DMG_PATH" ]; then
            echo "Missing DMG artifact" >&2
            exit 1
          fi

          # A2A-94: enforce hardened, signed, stapled artifacts before release upload.
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Package artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd native/macos/src-tauri/target/universal-apple-darwin/release/bundle

          # Create tar.gz of .app for postinstall download
          if [ -d "macos/A2A Callbook.app" ]; then
            cd macos
            tar -czf "../A2A-Callbook-${VERSION}.app.tar.gz" "A2A Callbook.app"
            cd ..
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/A2A-Callbook-*.app.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/macos/src-tauri/target/universal-apple-darwin/release/bundle/A2A-Callbook-*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
